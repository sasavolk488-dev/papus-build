name: Build Papus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p unpacked
          unzip -o srcready1.zip -d unpacked
          echo "=== Что внутри ==="
          ls -la unpacked

      - name: Fix gradle.properties
        run: |
          cd unpacked
          GRADLE_DIR=$(find . -name "build.gradle" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          echo "Найден build.gradle в: $GRADLE_DIR"
          # Удаляем захардкоженный путь к Java
          if [ -f "$GRADLE_DIR/gradle.properties" ]; then
            sed -i '/org.gradle.java.home/d' "$GRADLE_DIR/gradle.properties"
            echo "=== gradle.properties после правки ==="
            cat "$GRADLE_DIR/gradle.properties"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          cd unpacked
          GRADLE_DIR=$(find . -name "build.gradle" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          cd "$GRADLE_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: papus-jar
          path: 'unpacked/**/build/libs/*.jar'
