name: Build Papus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p unpacked
          unzip -o srcready1.zip -d unpacked
          ls -la unpacked

      - name: Find project dir
        id: proj
        run: |
          cd unpacked
          DIR=$(find . -name "build.gradle" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Fix gradle.properties
        run: |
          cd unpacked/${{ steps.proj.outputs.dir }}
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Patch AimAssist & KillAura
        run: |
          # Патчим AimAssist
          AIM=$(find unpacked -name "AimAssist.java" -path "*player*" | head -1)
          if [ -f "$AIM" ]; then
            cp patch/AimAssist.java "$AIM"
          fi

          # Добавляем файл KillAura
          KA_DIR=$(dirname "$AIM")
          cp patch/KillAura.java "$KA_DIR/KillAura.java"

      - name: Register KillAura in ModuleRepository
        run: |
          # Ищем файл репозитория модулей
          REPO=$(find unpacked -name "ModuleRepository.java" | head -1)
          echo "Patching repository: $REPO"

          # 1. Добавляем импорт KillAura
          sed -i '/import project.papus.implement.features.modules.player.AimAssist;/a import project.papus.implement.features.modules.player.KillAura;' "$REPO"

          # 2. Добавляем new KillAura() в список (ищем new AimAssist и добавляем после него)
          # Учитываем, что там может быть запятая или точка с запятой
          sed -i '/new AimAssist()/a \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new KillAura(),' "$REPO"

          # Выводим кусок файла, чтобы проверить, что всё вставилось
          echo "=== Проверка вставки ==="
          grep -A 2 -B 2 "KillAura" "$REPO"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          cd unpacked/${{ steps.proj.outputs.dir }}
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: papus-jar
          path: 'unpacked/**/build/libs/*.jar'
