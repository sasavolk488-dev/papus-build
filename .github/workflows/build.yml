name: Build Papus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p unpacked
          unzip -o srcready1.zip -d unpacked
          ls -la unpacked

      - name: Find project dir
        id: proj
        run: |
          cd unpacked
          DIR=$(find . -name "build.gradle" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Fix gradle.properties
        run: |
          cd unpacked/${{ steps.proj.outputs.dir }}
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Patch AimAssist
        run: |
          # Копируем из корня репозитория, а НЕ из unpacked
          AIM=$(find unpacked -name "AimAssist.java" -path "*player*" | head -1)
          echo "Patching: $AIM"
          cp patch/AimAssist.java "$AIM"
          head -20 "$AIM"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          cd unpacked/${{ steps.proj.outputs.dir }}
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: papus-jar
          path: 'unpacked/**/build/libs/*.jar'
