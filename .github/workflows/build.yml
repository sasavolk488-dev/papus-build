name: Build Papus Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip srcready1.zip -d project_source

      - name: Apply KillAura Patch
        run: |
          # Копируем нашу новую Килл Ауру прямо внутрь распакованного проекта
          cp patch/KillAura.java project_source/src/main/java/project/papus/implement/features/modules/player/KillAura.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          cd project_source
          # Умный поиск gradlew
          GRADLEW_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: papus-client-jar
          path: 'project_source/**/build/libs/*.jar'
